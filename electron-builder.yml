# Windows installer for the Loop desktop app.
# The web UI is shipped as extraResources (outside asar) → resources/web,
# which electron/config.js#getWebRoot reads when app.isPackaged.
appId: com.clpiran.loop.desktop   # keep in sync with APP_USER_MODEL_ID in electron/config.js
productName: Loop
copyright: Copyright © CLP Iran

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

extraResources:
  - from: web-build
    to: web

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Loop-${version}-win-${arch}.${ext}

# A short, branded setup: Welcome (Loop sidebar) → install folder → progress → Finish
# (with "Run Loop"). build/installer.nsh skips the per-user / per-machine page.
# Artwork: build/icon.ico (16–256 px, rounded navy icon), installerSidebar.bmp 164×314,
# installerHeader.bmp 150×57 — the app icon, a Latin "Loop" wordmark and the desktop wallpaper's planet.
nsis:
  artifactName: Loop-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Loop
  uninstallDisplayName: Loop
