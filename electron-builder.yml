# Windows installer for the Loop desktop app.
# The web UI is shipped as extraResources (outside asar) → resources/web,
# which electron/config.js#getWebRoot reads when app.isPackaged.
appId: com.clpiran.loop.desktop   # keep in sync with APP_USER_MODEL_ID in electron/config.js
productName: Loop
copyright: Copyright © CLP Iran

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

extraResources:
  - from: web-build
    to: web

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Loop-${version}-win-${arch}.${ext}

# A short, branded setup in Persian (right to left): Welcome → install folder → progress →
# Finish ("Run Loop"), in Loop's own design: build/installer.nsh draws its own welcome,
# folder and finish pages and dresses NSIS's progress page (pictures in build/installer/
# from `npm run installer:art`), loads NSIS's Farsi language and skips the per-user page.
# Artwork: build/icon.ico (16–256 px, rounded navy icon); installerSidebar.bmp 164×314 and
# installerHeader.bmp 150×57 are left for the uninstaller.
nsis:
  artifactName: Loop-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  include: build/installer.nsh
  installerLanguages: [fa_IR]
  language: '1065' # Farsi; installer.nsh maps electron-builder's "Persian" to NSIS's "Farsi"
  allowToChangeInstallationDirectory: false # installer.nsh has its own folder page
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Loop
  uninstallDisplayName: Loop
